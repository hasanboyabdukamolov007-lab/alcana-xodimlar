<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xodimlar Hujjatlari</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-top">
        <h1 id="app-title">Xodimlar Hujjatlari</h1>
        <div class="lang-switcher">
          <button data-lang="uz" class="lang-btn active">UZ</button>
          <button data-lang="ru" class="lang-btn">RU</button>
          <button data-lang="en" class="lang-btn">EN</button>
        </div>
      </div>
      <div id="user-info"></div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Xodim qidirish...">
      </div>
    </header>

    <section id="staff-list">
      <div id="staff-cards"></div>
    </section>

    <section id="staff-detail" class="hidden">
      <button id="back-btn" class="btn">← Orqaga</button>
      <div id="detail-content"></div>
    </section>

    <section id="employee-form" class="hidden">
      <h2 id="form-title">Yangi xodim qo'shish</h2>
      <form id="employee-form-el">
        <label id="label-name" for="input-name">Ism familiya</label>
        <input id="input-name" type="text" required autocomplete="name">

        <label id="label-pos-uz" for="input-pos-uz">Lavozim (UZ)</label>
        <input id="input-pos-uz" type="text">

        <label id="label-pos-ru" for="input-pos-ru">Lavozim (RU)</label>
        <input id="input-pos-ru" type="text">

        <label id="label-pos-en" for="input-pos-en">Lavozim (EN)</label>
        <input id="input-pos-en" type="text">

        <label id="label-photo" for="input-photo">Foto URL (ixtiyoriy)</label>
        <input id="input-photo" type="url" placeholder="https://...">

        <div class="form-actions">
          <button type="button" id="form-cancel" class="btn btn-secondary">Bekor qilish</button>
          <button type="submit" id="form-save" class="btn">Saqlash</button>
        </div>
      </form>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
